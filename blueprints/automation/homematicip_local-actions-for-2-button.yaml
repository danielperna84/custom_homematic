blueprint:
  name: Actions for 2-Button Homematic(IP) device
  description:
    When a button is pressed, the defined actions will be executed. Please
    keep in mind, that long-press actions might be executed multiple times, according
    to your configured minimum duration for long press. This can be configured in
    your CCU.
    The actions are driven by the event entities of the selected device, which are
    enabled by default. An event entity you have disabled or hidden cannot trigger them.
    Tested with HmIP-BSM, HmIP-BDT, HmIP-BSL, HmIP-WRC2. Should work with other device too.
    v2026-09-12
  domain: automation
  homeassistant:
    min_version: "2026.8.0"
  source_url: https://github.com/sukramj/homematicip_local/blob/main/blueprints/automation/homematicip_local-actions-for-2-button.yaml
  input:
    remote:
      name: 2-Button Device
      description: Please select one or more 2-Button devices of your Homematic(IP) Local integration.
      selector:
        device:
          integration: homematicip_local
          multiple: true

    notify_on_direct_links:
      name: Warn if direct connections exist in CCU
      description: >
        A persistent notification will be sent if there is a direct connection in the CCU for the pressed button.
        Off by default: while on, every keypress asks the CCU for the direct links of the pressed channel
        before the action runs, which delays the action by however long the CCU takes to answer.
      default: false
      selector:
        boolean: {}

    skip_actions_when_direct_link:
      name: Skip if direct connection exists in CCU
      description: >
        The configured action will be skipped if there is a direct connection in the CCU for the pressed button.
      default: false
      selector:
        boolean: {}

    action_top_short:
      name: Action
      description: Top-Button, Short Press
      default: []
      selector:
        action: {}
    action_top_long:
      name: Action
      description: Top-Button, Long Press
      default: []
      selector:
        action: {}
    action_bottom_short:
      name: Action
      description: Bottom-Button, Short Press
      default: []
      selector:
        action: {}
    action_bottom_long:
      name: Action
      description: Bottom-Button, Long Press
      default: []
      selector:
        action: {}

variables:
  notify_on_direct_links: !input notify_on_direct_links
  skip_actions_when_direct_link: !input skip_actions_when_direct_link

  action_top_short: !input action_top_short
  action_top_long: !input action_top_long
  action_bottom_short: !input action_bottom_short
  action_bottom_long: !input action_bottom_long

# The device target is expanded to the device's event entities and the press type
# is matched before the automation starts, so a press on a device that is not
# selected never runs it -- where the global homematic.keypress bus event started
# every such automation on every keypress of every device and sorted it out in a
# condition afterwards.
triggers:
  - trigger: event.received
    target:
      device_id: !input remote
    options:
      event_type:
        - press_short
        - press_long

actions:
  - variables:
      press_type: "{{ trigger.to_state.attributes.event_type }}"
      # channel_no is carried by the event entity. The int() default of -1
      # matches no button below, so an entity without the attribute -- a
      # keypress channel the integration could not number -- runs no action
      # instead of the one of channel 0.
      channel: "{{ trigger.to_state.attributes.channel_no | int(-1) }}"
      remote_device_id: "{{ device_id(trigger.entity_id) }}"
      has_configured_action: >-
        {% set t = press_type %}
        {% set s = channel %}
        {% if t == 'press_short' and s == 2 %}{{ (action_top_short | default([])) | length > 0 }}
        {% elif t == 'press_long' and s == 2 %}{{ (action_top_long | default([])) | length > 0 }}
        {% elif t == 'press_short' and s == 1 %}{{ (action_bottom_short | default([])) | length > 0 }}
        {% elif t == 'press_long' and s == 1 %}{{ (action_bottom_long | default([])) | length > 0 }}
        {% else %}false{% endif %}

  # Asking the CCU for direct links is by far the slowest step in this
  # automation -- a round trip on every single keypress, ahead of the action --
  # and its answer is read by nothing but the two options below. So it only runs
  # when one of them is on and the pressed button actually has an action; with
  # both off there is no CCU call left in the way of the action at all.
  # Everything depending on the answer stays inside this branch: variables set in
  # a nested sequence do not escape it.
  - choose:
      - conditions: >-
          {{ (notify_on_direct_links or skip_actions_when_direct_link) and has_configured_action }}
        sequence:
          - action: homematicip_local.get_link_peers
            data:
              device_id: "{{ remote_device_id }}"
              channel: "{{ channel }}"
            response_variable: link_peers

          - variables:
              direct_link_peer_count: >-
                {% set lists = (link_peers.values() | list) if link_peers is mapping else [] %}
                {{ lists | map('count') | sum }}
              has_direct_link: "{{ (direct_link_peer_count | int(0)) > 0 }}"

          - choose:
              - conditions: "{{ notify_on_direct_links and has_direct_link }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "Homematic CCU direct connection detected"
                      message: >-
                        Device {{ remote_device_id }}, channel {{ channel }} has direct CCU links (peers).
                        A Home Assistant action is configured for this button, but the CCU may also handle it directly.

          - choose:
              - conditions: "{{ skip_actions_when_direct_link and has_direct_link }}"
                sequence:
                  - stop: "Skipped blueprint actions: CCU direct connection exists for this channel."

  - choose:
      - conditions: "{{ press_type == 'press_short' and channel == 2 }}"
        sequence: !input "action_top_short"
      - conditions: "{{ press_type == 'press_long' and channel == 2 }}"
        sequence: !input "action_top_long"
      - conditions: "{{ press_type == 'press_short' and channel == 1 }}"
        sequence: !input "action_bottom_short"
      - conditions: "{{ press_type == 'press_long' and channel == 1 }}"
        sequence: !input "action_bottom_long"
mode: parallel
max: 10
